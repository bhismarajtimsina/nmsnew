# Refuses secrets in git on every change, whatever it touches (Plans 33 and 35). See tools/secret_scan.py.
name: secrets

on:
  pull_request:
  push:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No secrets are tracked
        run: python3 tools/secret_scan.py
