# NOTE: GitHub only reads workflows at the root of the repository. This repository is currently rooted above `nms/`
# (see docs/cybersathy-nms-migration/35-repo-hygiene-and-secrets.md). Move this file to the real repository root when that is fixed.
name: backend

on:
  pull_request:
    paths: ["backend/**", "tools/gen_permission_catalogue.py", "tools/gen_device_model_catalogue.py", "docs/cybersathy-nms-migration/permission-mapping.md", "vendor/meklis/switcher-core/configs/models/**"]
  push:
    branches: [main]
    paths: ["backend/**", "tools/gen_permission_catalogue.py", "tools/gen_device_model_catalogue.py", "docs/cybersathy-nms-migration/permission-mapping.md", "vendor/meklis/switcher-core/configs/models/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["6379:6379"]
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: The permission catalogue is up to date with its sources
        run: python3 tools/gen_permission_catalogue.py && git diff --exit-code backend/app/access/catalogue_data.py
      - name: The device model catalogue is up to date with the legacy vendor files
        run: python3 tools/gen_device_model_catalogue.py && git diff --exit-code backend/app/registry/device_model_data.py
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
