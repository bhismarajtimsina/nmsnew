- key: switches_reboot_device
  description: Reboot device
  logic_group: switches
  routes:
    - ^(PUT):/system/([0-9]{1,})/reboot$

- key: switches_save_config
  description: Save config on device
  logic_group: switches
  routes:
    - ^(PUT):/system/([0-9]{1,})/save_config$

