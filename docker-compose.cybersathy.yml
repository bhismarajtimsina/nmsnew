name: cybersathy-nms

# Every secret is required. Compose stops with a message instead of falling back to a default.
# Copy docker/cybersathy.env.example to cybersathy.env, fill it in, and start with:
#   docker compose --env-file cybersathy.env -f docker-compose.cybersathy.yml up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-image: &api-build
  context: ./backend
  dockerfile: Dockerfile
  target: runtime

x-api-env: &api-env
  APP_NAME: CyberSathy-NMS
  ENVIRONMENT: ${CYBERSATHY_ENVIRONMENT:-development}
  LOG_LEVEL: ${CYBERSATHY_LOG_LEVEL:-INFO}
  SESSION_TTL_HOURS: ${CYBERSATHY_SESSION_TTL_HOURS:-24}
  POSTGRES_HOST: cybersathy-postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${CYBERSATHY_POSTGRES_DB:-cybersathy_nms}
  POSTGRES_USER: ${CYBERSATHY_POSTGRES_USER:-cybersathy}
  POSTGRES_PASSWORD: ${CYBERSATHY_POSTGRES_PASSWORD:?set CYBERSATHY_POSTGRES_PASSWORD in cybersathy.env}
  REDIS_URL: redis://:${CYBERSATHY_REDIS_PASSWORD:?set CYBERSATHY_REDIS_PASSWORD in cybersathy.env}@cybersathy-redis:6379/0
  # Only the Nginx container may say who the client is. This is the Docker bridge range this stack runs in.
  FORWARDED_ALLOW_IPS: ${CYBERSATHY_FORWARDED_ALLOW_IPS:-172.16.0.0/12}
  JOB_SIGNING_KEY: ${CYBERSATHY_JOB_SIGNING_KEY:?set CYBERSATHY_JOB_SIGNING_KEY in cybersathy.env}
  # No SNMP transport exists in this build. The workers never open a session to a device, whatever is queued.
  SNMP_TRANSPORT: disabled
  MANAGEMENT_NETWORKS: ${CYBERSATHY_MANAGEMENT_NETWORKS:-}
  ENCRYPTION_KEYS: ${CYBERSATHY_ENCRYPTION_KEYS:-}
  ENCRYPTION_ACTIVE_KEY_ID: ${CYBERSATHY_ENCRYPTION_ACTIVE_KEY_ID:-}

services:
  cybersathy-nginx:
    image: nginx:1.27-alpine
    container_name: cybersathy-nginx
    restart: unless-stopped
    depends_on:
      cybersathy-api:
        condition: service_healthy
      cybersathy-frontend:
        condition: service_started
    ports:
      - "${CYBERSATHY_NGINX_EXPOSE:-8080}:80"
    volumes:
      - ./docker/cybersathy-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/cybersathy-nginx/gate.inc:/etc/nginx/conf.d/gate.inc:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *logging
    networks:
      - cybersathy-network

  cybersathy-frontend:
    image: nginx:1.27-alpine
    container_name: cybersathy-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    logging: *logging
    networks:
      - cybersathy-network

  # Runs once per start: applies migrations and the idempotent seed, then exits. The API waits for it.
  cybersathy-init:
    build: *api-build
    image: cybersathy-nms-api:local
    container_name: cybersathy-init
    restart: "no"
    command: ["sh", "-c", "python -m app.cli db upgrade && python -m app.cli seed"]
    environment:
      <<: *api-env
      CYBERSATHY_SEED_ADMIN_USERNAME: ${CYBERSATHY_SEED_ADMIN_USERNAME:-admin}
      CYBERSATHY_SEED_ADMIN_EMAIL: ${CYBERSATHY_SEED_ADMIN_EMAIL:-}
      CYBERSATHY_SEED_ADMIN_PASSWORD: ${CYBERSATHY_SEED_ADMIN_PASSWORD:-}
      CHECK_SCHEMA_ON_START: "false"
    depends_on:
      cybersathy-postgres:
        condition: service_healthy
    logging: *logging
    networks:
      - cybersathy-network

  cybersathy-api:
    build: *api-build
    image: cybersathy-nms-api:local
    container_name: cybersathy-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      cybersathy-init:
        condition: service_completed_successfully
      cybersathy-postgres:
        condition: service_healthy
      cybersathy-redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - cybersathy-network

  # Publishes queued jobs and consumes them. With the SNMP transport disabled it heartbeats and dispatches, and consumes nothing.
  cybersathy-worker:
    build: *api-build
    image: cybersathy-nms-api:local
    container_name: cybersathy-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers", "run", "--kinds", "dispatcher,discovery,poller,scheduler"]
    environment: *api-env
    depends_on:
      cybersathy-init:
        condition: service_completed_successfully
      cybersathy-postgres:
        condition: service_healthy
      cybersathy-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers", "health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - cybersathy-network

  # Own process (app/traps/__main__.py), not an app.workers kind: a stream of unsolicited UDP datagrams doesn't fit a
  # pull-based job queue. Binds a port of its own, not the standard 162, until cutover hands that over (D-19).
  cybersathy-trap-receiver:
    build: *api-build
    image: cybersathy-nms-api:local
    container_name: cybersathy-trap-receiver
    restart: unless-stopped
    command: ["python", "-m", "app.traps", "run"]
    environment:
      <<: *api-env
      TRAP_LISTENER_PORT: ${CYBERSATHY_TRAP_LISTENER_PORT:-1162}
      TRAP_CHECK_COMMUNITY: ${CYBERSATHY_TRAP_CHECK_COMMUNITY:-false}
    ports:
      - "${CYBERSATHY_TRAP_LISTENER_EXPOSE:-1162}:1162/udp"
    depends_on:
      cybersathy-init:
        condition: service_completed_successfully
      cybersathy-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.traps", "health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - cybersathy-network

  # Own process (app/pinger/__main__.py), not an app.workers kind: an active periodic network probe doesn't fit the
  # Redis Streams job-consumer shape either. Unprivileged ICMP (Linux datagram sockets) needs no capability at all,
  # unlike the legacy Go binary's raw sockets - cap_drop: ALL is unchanged from every other service here.
  cybersathy-pinger:
    build: *api-build
    image: cybersathy-nms-api:local
    container_name: cybersathy-pinger
    restart: unless-stopped
    command: ["python", "-m", "app.pinger", "run"]
    environment: *api-env
    depends_on:
      cybersathy-init:
        condition: service_completed_successfully
      cybersathy-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.pinger", "health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - cybersathy-network

  # Own process (app/notifications/__main__.py), not an app.workers kind: it self-paces against `notifications`
  # directly (poll, idle-sleep when nothing is due) rather than pulling from a Redis Streams queue something else
  # feeds - the same shape NotificationSenderService.php's own long-running `service` command has. No real
  # Telegram/email channel exists yet (app/notifications/sender.py's UnconfiguredChannel), so every send currently
  # fails and is recorded that way rather than delivered - honest, not fabricated, until a real channel is built.
  cybersathy-notification-sender:
    build: *api-build
    image: cybersathy-nms-api:local
    container_name: cybersathy-notification-sender
    restart: unless-stopped
    command: ["python", "-m", "app.notifications", "run"]
    environment: *api-env
    depends_on:
      cybersathy-init:
        condition: service_completed_successfully
      cybersathy-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.notifications", "health"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - cybersathy-network

  cybersathy-postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: cybersathy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CYBERSATHY_POSTGRES_DB:-cybersathy_nms}
      POSTGRES_USER: ${CYBERSATHY_POSTGRES_USER:-cybersathy}
      POSTGRES_PASSWORD: ${CYBERSATHY_POSTGRES_PASSWORD:?set CYBERSATHY_POSTGRES_PASSWORD in cybersathy.env}
    volumes:
      - cybersathy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks:
      - cybersathy-network

  # Persistent, password-protected, never evicts: Redis Streams will carry polling jobs and events.
  cybersathy-redis:
    image: redis:7.4-alpine
    container_name: cybersathy-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${CYBERSATHY_REDIS_PASSWORD:?set CYBERSATHY_REDIS_PASSWORD in cybersathy.env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --dir
      - /data
    volumes:
      - cybersathy_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${CYBERSATHY_REDIS_PASSWORD:?set CYBERSATHY_REDIS_PASSWORD in cybersathy.env}
    logging: *logging
    networks:
      - cybersathy-network

volumes:
  cybersathy_postgres_data:
  cybersathy_redis_data:

networks:
  cybersathy-network:
    driver: bridge
