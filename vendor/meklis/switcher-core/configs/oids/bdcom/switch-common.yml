# The OID base every BDCOM Ethernet switch shares.
#
# Named for what it is rather than for the one unit it was proved on: BDCOM
# publishes device-generic data under nmsMgmt (.1.3.6.1.4.1.3320.9.x) and the
# chassis tree (.3.6.10.x), which are the same locations on every product they
# make. Confirmed by comparison, not assumption — resources.cpuUtil,
# sys.serialNum, sys.macAddress, sfp.ddm.* and the VLAN names below carry
# byte-identical OIDs in this file, in ./3310c.yml (an EPON OLT) and in
# ./gp3600.yml (a GPON OLT).
#
# What a family adds on top of this — fan, power supply and CPU temperature,
# fitted on some models and not others — lives in its own file beside this one
# (./s2900.yml and friends), the same way each OLT family has its own. A model
# lists this file first and its family file second.
#
# These are plain L2/L3 switches, not PON products, so nothing here carries
# the ont.*/pon.* OIDs the OLT files use.
# Confirmed live against a real S5612 (sysObjectID .1.3.6.1.4.1.3320.1.283,
# firmware "BDCOM(tm) S5612 Software, Version 127335") on 2026-09-05 —
# every name below responded with a real value except where noted. That unit
# is still the only one confirmed against real hardware; the names are shared
# by construction (see above), the readings are per device.
#
# The switch shares the same private enterprise MIB tree BDCOM's OLT
# products use for board/system info (3320.9.225.x) and CPU/mem
# (3320.3.6.10.x), which is why the sys.*/resources.* names below match
# ./gp3600.yml and ./3310c.yml exactly. It does NOT expose the OLT's fan
# (3320.9.187.4.1.2) or CPU-temperature (3320.3.6.10.1.13) OIDs — both
# returned "No Such Object"/"No Such Instance" live — so neither is
# declared here; sys_resources/sys_temp are wired to a switch-specific
# module (see Modules/BDcom/Switches/SystemResources.php) that treats
# those two as optional instead of assuming they exist.

- {name: resources.cpuUtil, oid: .1.3.6.1.4.1.3320.3.6.10.1.11}
- {name: resources.memUtil, oid: .1.3.6.1.4.1.3320.3.6.10.1.12}

# LLDP override — confirmed via BDCOM's own authoritative NMS-LLDP-MIB
# (downloaded directly from BDCOM's site): the switch's LLDP data isn't
# missing, it's just published under BDCOM's own private OID branch
# instead of the standard IANA one. NMS-LLDP-MIB literally says "Published
# as part of IEEE Std 802.1AB-2004 initial version" — i.e. it's the exact
# same LLDP-MIB structure, just re-hosted at `nms 127` (.3320.127.1.*)
# instead of the standard `.1.0.8802.1.1.2.1.*` that global.oids.yml's
# lldp.* names point at (which is why BDcom\LldpInfo got "No Such Object"
# querying it — right structure, wrong root). Field offsets underneath
# are identical to the standard MIB (locChassisId=lldpLocalSystemData.2,
# locPortId=...7.1.3, remChassisId=lldpRemoteSystemsData.1.1.5,
# remPortId=...1.1.7) — only the .1.3.6.1.4.1.3320.127.1 prefix differs.
# NOT live-tested against this device (still avoiding live SNMP here per
# instruction) — ready to verify next time that's safe to do.
- {name: lldp.locChassisId, oid: .1.3.6.1.4.1.3320.127.1.3.2}
- {name: lldp.locPortId, oid: .1.3.6.1.4.1.3320.127.1.3.7.1.3}
- {name: lldp.remChassisId, oid: .1.3.6.1.4.1.3320.127.1.4.1.1.5}
- {name: lldp.remPortId, oid: .1.3.6.1.4.1.3320.127.1.4.1.1.7}

- {name: sys.serialNum, oid: .1.3.6.1.4.1.3320.9.225.1.2.0}
- {name: sys.boardHardwareVer, oid: .1.3.6.1.4.1.3320.9.225.1.7.0}
- {name: sys.boardSoftwareVer, oid: .1.3.6.1.4.1.3320.9.225.1.8.0}
- {name: sys.macAddress, oid: .1.3.6.1.4.1.3320.9.225.1.9.0}

