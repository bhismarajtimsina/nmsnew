# readings (e.g. < -40dBm). Confirmed live: every port on this switch
# returns the class's own "no DDM reading" sentinel (-65535) right now.
# Cross-checked against LibreNMS's real BDCOM driver/MIBs (see
# docs/bdcom-s5612-oid-reference.md): this ISN'T a universal BDCOM
# limitation — a real captured recording from a sibling switch model shows
# plenty of real, non-sentinel readings on that unit. What IS confirmed
# live on THIS unit is `sfp.ddm.present` below reading "offline" (2) on
# every single port (checked all 9) — i.e. no monitored transceiver is
# inserted anywhere on this switch right now, which is what's actually
# producing the all-null readings, not a firmware/DDM-support gap.
