# --- Everything below was found by walking this device's private tree and,
# at the time, could not be matched to a meaning — it shipped under an
# `unconfirmed.*` prefix with guessed labels. Every one of those 74 names has
# now been resolved against BDCOM's own NMS-* MIBs, which are the published
# definitions for the whole product line, by following each object's
# `::= { parent N }` chain back to the enterprise root. The names below are
# what BDCOM calls these objects; the source MIB is named on each group.
#
# Several of the old guesses were simply wrong, which is the point of doing
# this from the definitions rather than from the values: `unit.uptimeTicks`
# is really cardSysType, `portTimerOrRateLimit` is really the per-port PVID,
# and the "~29k row FDB-adjacent table" is really the ACL-applied-on-interface
# table. A handful of branches genuinely are not in the MIBs; those keep an
# `undocumented.` prefix rather than a name that implies more than is known.

