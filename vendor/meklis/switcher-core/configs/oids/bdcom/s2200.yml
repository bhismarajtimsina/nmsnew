# BDCOM S2200 series.
#
# Fast Ethernet access switches with gigabit uplinks.
#
# The shared switch base is ./switch-common.yml, which every model in this
# family lists first; this file is what the family adds on top.
#
# The sensors below are declared for every switch family rather than guessed
# at per family: whether a unit answers them is a question about the hardware
# in front of you, not about the series name, and a desktop model with one
# external supply simply returns nothing. Both modules that read them omit
# what does not answer instead of failing the whole reading, so declaring
# them costs nothing and skipping them would hide a real sensor.
# --- Chassis sensors. Definitions are from BDCOM's own MIBs, not inferred:
# NMS-POWER-MIB puts `power` at nmsMgmt 189 with `powerStatus` as power.1 and
# the four states below spelled out; NMS-FAN-TRAP puts `fanTrap` at nmsMgmt
# 187 with FanTable at fanTrap.4, FanStatus in column 2 and FanSpeed in
# column 3; card temperature sits in the chassis tree at .3.6.10.1.13. The
# BDCOM OLT files beside this one already use these exact OIDs.
#
# Whether a given unit answers them is a hardware question, not a firmware
# one — a fanless desktop model reports none of this. Both modules that read
# them (BDcom\Switches\SystemResources and BDcom\Switches\PowerStatus)
# omit what does not answer instead of failing the whole reading.
- {name: system.power.status, oid: .1.3.6.1.4.1.3320.9.189.1.0, values: {1: A-normal, 2: B-normal, 3: A-B-normal, 4: other}}
- {name: system.fan.status, oid: .1.3.6.1.4.1.3320.9.187.1, values: {1: Normal, 2: Stop}}
- {name: resources.fanStatus, oid: .1.3.6.1.4.1.3320.9.187.4.1.2, values: {1: Normal, 2: Stop, 3: Unused}}
- {name: resources.fanSpeed, oid: .1.3.6.1.4.1.3320.9.187.4.1.3}
- {name: sensors.temperature.cpu, oid: .1.3.6.1.4.1.3320.3.6.10.1.13}
