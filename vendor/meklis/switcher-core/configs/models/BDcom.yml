  # Plain L2/L3 Ethernet switch, not a PON/OLT product — confirmed live
  # against a real unit on 2026-09-05 (sysDescr "BDCOM(tm) S5612 Software,
  # Version 127335", sysObjectID .1.3.6.1.4.1.3320.1.283.0). It shares the
  # OLT products' private system/resources MIB tree (see ./oids/bdcom/
  # s5612.yml for exactly which names were confirmed present), but doesn't
  # expose their PON/ONT features at all, so none of those modules are
  # wired up here. CPU/mem are read through a switch-specific
  # sys_resources module (Modules/BDcom/Switches/SystemResources.php)
  # since this unit's fan-status and CPU-temperature OIDs — present on the
  # OLT chassis models — don't exist on it (confirmed live: both returned
  # "No Such Object"/"No Such Instance").
  - name: BDCOM S5612
    key: bdcom_s5612
    inputs:
      - snmp
      - console
    detect: {description: ^BDCOM.*S5612, objid: ^.1.3.6.1.4.1.3320.1.283.0 }
    device_type: SWITCH
    traps:
      - ./traps/bdcom.yml
    oids:
      - ./oids/bdcom/switch-common.yml
    modules:
      system: \SwitcherCore\Modules\BDcom\SystemInformation
      parse_interface: \SwitcherCore\Modules\BDcom\ParseInterface
      interfaces_list: \SwitcherCore\Modules\BDcom\InterfacesList
      interface_counters: \SwitcherCore\Modules\BDcom\InterfaceCountersNew
      interface_descriptions: \SwitcherCore\Modules\BDcom\InterfaceDescriptions
      link_info: \SwitcherCore\Modules\BDcom\LinkInfo
      lldp_info: \SwitcherCore\Modules\BDcom\LldpInfo
      sfp_optical: \SwitcherCore\Modules\BDcom\GP3600\SfpOpticalInfo
      # The console FDB module below stays unused — confirmed live it HANGS
      # (not just fails) when called: telnet:23 accepts the TCP connection
      # then immediately closes it with no prompt, and the console client
      # library blocks indefinitely waiting for a login prompt that will
      # never come, rather than timing out. Since `fdb` gets unconditionally
      # bundled into every "get interface info" request once a model
      # declares it, this tied up a live PHP/RoadRunner worker for 90+
      # seconds on a single request — a real risk of exhausting the whole
      # worker pool if it happened repeatedly. Re-enable only after real,
      # tested console (SSH/Telnet) credentials are confirmed working for
      # this specific switch. MAC lookup is served instead by the SNMP
      # reader below, which walks the standard Q-BRIDGE table this switch
      # answers — no console, no blocking.
      fdb: \SwitcherCore\Modules\BDcom\Switches\FdbDot1Bridge
      vlans: \SwitcherCore\Modules\BDcom\Vlans
      ctrl_port_descr: \SwitcherCore\Modules\BDcom\DescriptionControl
      sys_resources: \SwitcherCore\Modules\BDcom\Switches\SystemResources
      save_config: \SwitcherCore\Modules\BDcom\OltSaveSettings
      console_command: \SwitcherCore\Modules\BDcom\RawConsoleCommand
      multi_console_command: \SwitcherCore\Modules\BDcom\MultiRawConsoleCommand
      snooping_info: \SwitcherCore\Modules\BDcom\SnoopingInfo
      net_settings: \SwitcherCore\Modules\General\NetSettings
      supported_modules: \SwitcherCore\Modules\General\SupportedModules
      sfp_diag: \SwitcherCore\Modules\General\SfpDiag
    extra:
      console_conn_type: bdcom
      console_commands_after_connect:
        - {command: enable, check_password: true}
        - terminal length 0

# ---------------------------------------------------------------------------
# BDCOM Ethernet switches.
#
# Everything below is a plain L2/L3 switch, detected from the model name
# BDCOM puts in sysDescr ("BDCOM(tm) S5612 Software, Version 127335"), with
# the enterprise root as a second guard so another vendor's device can never
# land here. Product sysObjectIDs are assigned per model and BDCOM does not
# publish them in the MIBs, so the root (.1.3.6.1.4.1.3320) is as specific as
# detection can honestly be for a family; the one model with a confirmed
# product OID, S5612, keeps its exact match above.
#
# They all share configs/oids/bdcom/s5612.yml and one module set: the private
# tree that file documents (system, CPU/memory, VLANs, LLDP at BDCOM's own
# .3320.127 root, SFP DDM) is the same across the switch line — families
# differ in port count and silicon, not in where they publish those.
#
# `fdb` is deliberately absent everywhere here, exactly as on bdcom_s5612:
# the only FDB module for BDCOM reads the console, and that was confirmed to
# hang a worker for 90+ seconds on a switch whose telnet accepts then drops
# the connection. Wire it up per model once console credentials are proven.
#
# Sub-model names under `rewrites` come from BDCOM's own product catalogue;
# the OID they read is cardSysDescr, which on the live S5612 returns its bare
# model name. A family whose device does not answer that OID keeps the series
# name, which is why the series entry is the one that carries the modules.
# ---------------------------------------------------------------------------

