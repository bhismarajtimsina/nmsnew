  - name: BDCOM switch (generic)
    key: bdcom_switch_generic
    # No family OID file: nothing is known about a model that matched nothing
    # above, so it gets the shared base and no assumptions on top.
    # Anything BDCOM with a switch-shaped model name that no entry above
    # claims. Must stay last: first match wins, so a family entry earlier
    # in this file always beats it. The model-name shape (S/IES + digits)
    # is what keeps it off the P-series and GP-series OLTs above.
    inputs:
      - snmp
      - console
    detect: {description: '^BDCOM.*\b(S|IES)\d{3,4}', objid: '^.1.3.6.1.4.1.3320'}
    device_type: SWITCH
    traps:
