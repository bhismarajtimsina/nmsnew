# --- Added from BDCOM's own NMS-* MIBs. An unrecognised trap OID is dropped
# by the listener, so a notification the device is documented to send but this
# file never declared is a notification nobody ever sees.
#
# Every OID below is the numeric address the MIB assigns that NOTIFICATION-TYPE,
# resolved by following its ::= { parent N } chain to the enterprise root
# (tools/bdcom-mib-oid-map.py). Not verified against live hardware: no device
# testing is done on this project, and no trap has ever been logged here, so
# there is nothing to compare against.

# The MIB defines gponOnuSfpParameterAlarmNotification at .10.3.6.2, and
# defines nothing at .10.3.6.3 where OnuSfpParameterAlarm above points. That
# looks like an off-by-one, but the older line is left in place rather than
# corrected: if some firmware really does emit .3, replacing it would break a
# path that works today. Declaring both costs nothing.
- name: OnuSfpParameterAlarmNotification
  description: The agent generates this notification when ONU SFP parameter alarms (MIB-defined OID)
  object: .1.3.6.1.4.1.3320.10.3.6.2
  modules:
    - pon_onts_optical
  is_interface: true

# An ONU's own last gasp as it loses power — the earliest and most reliable
# signal that a subscriber has gone dark, and worth far more than waiting for
# the next poll to notice.
- name: OnuDyingGaspNotification
  description: The agent generates this notification when an ONU reports dying gasp (power loss)
  object: .1.3.6.1.4.1.3320.10.3.8.2
  modules:
    - pon_onts_status
  is_interface: true

# The OLT's own PON-side optical module, as opposed to an ONU's.
- name: OltPonSfpParameterAlarmNotification
  description: The agent generates this notification when the OLT PON optical module leaves or returns to normal
  object: .1.3.6.1.4.1.3320.10.2.5.2
  is_interface: true

# An ONU trying to register that the OLT will not accept — either a
