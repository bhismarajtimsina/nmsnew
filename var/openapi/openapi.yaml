                query:
                  type: object
                  nullable: true
                  additionalProperties: []
                limit:
                  type: integer
                  example: 50
                page:
                  type: integer
                  example: 1
                ascending:
                  type: integer
                  enum: [0, 1]
                  example: 1
                byColumn:
                  type: integer
                  enum: [0, 1]
                  example: 1
                filter:
                  properties: { devices: { type: array, items: { properties: { id: { type: integer, example: '10' } }, type: object } }, field: { type: string, example: any }, expression: { type: string, enum: ['~', '=', '!=', '>', '<', '>=', '<='], example: '~' }, value: { type: string, example: null, nullable: true }, ont_status: { type: string, example: All }, bad_signals: { type: boolean, example: false } }
