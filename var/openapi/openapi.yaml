  /system/cross-auth:
    post:
      tags:
        - auth
      summary: 'Cross-authenticate as another user'
      description: 'Creates temporary auth key for target user by login. Requires system_cross_auth_user permission.'
      operationId: 8c9b65b2e36ea9d407cc0e972907d190
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - login
              properties:
                login:
                  type: string
                  example: operator
                expire_sec:
                  type: integer
                  example: 3600
                  nullable: true
                user_ip:
                  type: string
                  example: 10.0.0.5
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Cross-auth key generated'
          content:
            application/json:
              schema:
                properties:
                  statusCode: { type: integer, example: 200 }
                  data: { properties: { user: { $ref: '#/components/schemas/UserShort' }, expired_at: { type: string, example: '2026-02-25 15:20:00' }, auth_key: { type: string, example: 0b53d498-b8fe-4be2-a24f-39ec9ef72e4a } }, type: object }
                type: object
        '400':
          description: 'Bad Request'
          content:
            application/json:
              schema:
                properties:
                  statusCode: { type: integer, example: 400 }
                  error: { type: string, example: 'Bad Request' }
                  message: { type: string, example: 'Login is required field' }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
        -
          XAuthKey: []
  /auth:
    post:
      tags:
        - auth
      summary: 'User authentication'
      description: 'Authenticates user by login and password. If two-factor authentication is enabled and PIN is not provided, returns need_2fa=true.'
      operationId: 66a9ef7d7e19966ac1701375be10fe15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: secret
                twofa_pin:
                  type: string
                  example: '123456'
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Successful authentication or 2FA challenge'
          content:
            application/json:
              schema:
                properties:
                  statusCode: { type: integer, example: 200 }
                  data: { oneOf: [{ properties: { need_2fa: { type: boolean, example: true } }, type: object }, { $ref: '#/components/schemas/UserAuthKey' }] }
                type: object
        '400':
          description: 'Bad Request'
          content:
            application/json:
              schema:
                properties:
                  statusCode: { type: integer, example: 400 }
                  error: { type: string, example: 'Bad Request' }
                  message: { type: string, example: 'Login and password are required fields' }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /logout:
    delete:
      tags:
        - auth
      summary: 'Logout current user'
      description: 'Closes current auth session identified by XAuthKey token.'
      operationId: cce3edae1f4d2bc434cd9b7e87eed716
      responses:
        '200':
          description: 'Session successfully closed'
