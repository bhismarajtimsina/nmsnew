; PATCHED: was 180s — confirmed live this was SHORTER than the app's own
; configured console-operation budget (SWC_CONSOLE_TIMEOUT_SEC=300 in
; .env), meaning a legitimately slow-but-eventually-successful device
; operation would ALWAYS get violently killed by PHP itself (the whole
; RoadRunner worker process dies, producing a raw HTML error page instead
; of a clean JSON response) before it could ever finish, no matter what.
; 360s gives the full 300s console budget real headroom plus margin for
; whatever else runs in the same request (SNMP polling, etc.).
max_execution_time=360
display_errors=1
memory_limit=1024M

[xdebug]
xdebug.mode=off
xdebug.default_enable=0
xdebug.remote_autostart=0
xdebug.remote_enable=0
xdebug.profiler_enable=0

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.max_accelerated_files=32531
opcache.memory_consumption=512
opcache.interned_strings_buffer=16

#Test preloading
#opcache.preload_user=www-data
#opcache.preload=/www/app/init.php

