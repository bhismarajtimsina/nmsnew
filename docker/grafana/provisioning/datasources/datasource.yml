apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://wca-prometheus:9090/prometheus
    basicAuth: false
    isDefault: true
    editable: true
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://wca-loki:3100
    basicAuth: false
    editable: true
  - name: wca-db
    type: mysql
    editable: true
    url: wca-db:3306
    user: root
    jsonData:
      database: support
      maxOpenConns: 30
      maxIdleConns: 30
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
    secureJsonData:
      password: superpassword
