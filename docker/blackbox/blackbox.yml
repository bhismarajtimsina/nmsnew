modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      follow_redirects: true

  tcp_connect:
    prober: tcp
    timeout: 10s

  dns_udp:
    prober: dns
    timeout: 10s
    dns:
      preferred_ip_protocol: ip4
      query_name: example.com
      query_type: A

  icmp:
    prober: icmp
    timeout: 10s
    icmp:
      preferred_ip_protocol: ip4
