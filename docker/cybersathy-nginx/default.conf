# Rate limit for password guessing. Applies to the login endpoint only, so a busy single-page app polling
# /api/v1/auth/session is never throttled. The application adds its own per-account lockout on top.
limit_req_zone $binary_remote_addr zone=cs_login:10m rate=10r/m;

# Upgrade handling for the realtime endpoint.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    # Small by default. A route that really needs large uploads sets its own limit.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The API sees the real client address only through these headers, and trusts them only from this proxy.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://cybersathy-frontend:80;
    }

    location = /api/v1/auth/login {
        limit_req zone=cs_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://cybersathy-api:8000/api/v1/auth/login;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/v1/ {
        proxy_pass http://cybersathy-api:8000/api/v1/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /health {
        access_log off;
        proxy_pass http://cybersathy-api:8000/health;
    }

    # /ready and /metrics are deliberately not exposed here. Prometheus scrapes the API over the internal network.

    location /ws {
        proxy_http_version 1.1;
        proxy_pass http://cybersathy-api:8000/ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Console gateway (Plan 38). Exact path only; the ticket in the query string is single-use and expires in 30 s.
    # Timeouts above the gateway's own 30-minute session limit, so nginx never cuts a session first.
    location = /console/ws {
        proxy_http_version 1.1;
        proxy_pass http://cybersathy-console:8010/console/ws;
        access_log off;  # the URL carries the ticket; spent at once, but kept out of logs anyway
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 2000s;
        proxy_send_timeout 2000s;
    }

    # Auth gate for proxied apps. One internal location per app, with the app name fixed in it, so a request can never
    # choose which permission it is checked against. A proxied app is added like this once it joins the stack:
    #
    #     location /grafana/ {
    #         auth_request /_auth_gate/grafana;
    #         auth_request_set $auth_user $upstream_http_x_auth_user;
    #         auth_request_set $auth_role $upstream_http_x_auth_grafana_role;
    #         proxy_set_header X-WEBAUTH-USER $auth_user;
    #         proxy_set_header X-WEBAUTH-ROLE $auth_role;
    #         proxy_pass http://grafana:3000/;
    #     }
    location = /_auth_gate/grafana      { internal; include /etc/nginx/conf.d/gate.inc; proxy_pass http://cybersathy-api:8000/api/v1/auth/verify?app=grafana; }
    location = /_auth_gate/prometheus   { internal; include /etc/nginx/conf.d/gate.inc; proxy_pass http://cybersathy-api:8000/api/v1/auth/verify?app=prometheus; }
    location = /_auth_gate/alertmanager { internal; include /etc/nginx/conf.d/gate.inc; proxy_pass http://cybersathy-api:8000/api/v1/auth/verify?app=alertmanager; }
    location = /_auth_gate/config-backups { internal; include /etc/nginx/conf.d/gate.inc; proxy_pass http://cybersathy-api:8000/api/v1/auth/verify?app=config-backups; }
}
